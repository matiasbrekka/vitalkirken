<style>
:root{
  --sand:#f0ecd9; --kull:#383838; --grus:#939288; --strek:#d8d3bd;

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--sand);color:var(--kull);

header{background:var(--kull);color:var(--sand)}
.topp{max-width:840px;margin:0 auto;padding:16px 18px 0;display:flex;align-items:center;gap:14px}
.logo{height:30px;width:auto;display:block;flex:0 0 auto}
.merke h1{margin:0;font-size:15px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.merke p{margin:1px 0 0;font-size:12.5px;color:#b6b3a4;letter-spacing:.03em}
nav{max-width:840px;margin:14px auto 0;padding:0 18px;display:flex;gap:26px}
nav button{background:none;border:0;padding:0 0 11px;cursor:pointer;

  border-bottom:2px solid transparent}
nav button.on{color:var(--sand);border-bottom-color:var(--sand)}
main{max-width:840px;margin:0 auto;padding:24px 18px 72px}

.kort{background:var(--papir);border:1px solid var(--strek)}
h3.etikett{margin:0 0 9px;font-size:10.5px;font-weight:600;letter-spacing:.14em;

h3.etikett:not(:first-child){margin-top:22px}
.dato{flex:0 0 50px;line-height:1.05}
.dato b{display:block;font-size:26px;font-weight:600;letter-spacing:-.02em}
.dato span{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--grus)}
.merk{display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.08em;

.mangler{color:var(--rust)}

.felt{flex:1;min-width:150px}
.felt label{display:block;font-size:10.5px;font-weight:600;letter-spacing:.14em;

const kod = s => encodeURIComponent(s).replace(/[()!'*]/g,
  c => '%' + c.charCodeAt(0).toString(16).toUpperCase());
function filUrl(hvor, filnavn){
  const m = MAPPE[hvor], id = FILID[hvor+':'+filnavn];
  return id
    ? `https://www.dropbox.com/scl/fo/${m.id}/${id}/${kod(filnavn)}?rlkey=${m.key}&dl=0`
    : `https://www.dropbox.com/scl/fo/${m.id}/${m.map}?rlkey=${m.key}&dl=0&preview=${kod(filnavn)}`;
}

let TEAMS = {};

/* ======================================================= HJELPEFUNK. ===== */
function parseCsv(text){
  const rows=[]; let row=[], cell='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=c; }
    else if(c==='"') q=true;
    else if(c===','){ row.push(cell); cell=''; }
    else if(c==='\n'){ row.push(cell); rows.push(row); row=[]; cell=''; }
    else if(c!=='\r') cell+=c;
  }
  if(cell!==''||row.length){ row.push(cell); rows.push(row); }
  return rows.map(r=>r.map(v=>v.trim()));
}
const MND={jan:1,feb:2,mar:3,apr:4,mai:5,jun:6,jul:7,aug:8,sep:9,okt:10,nov:11,des:12};
const pad=n=>String(n).padStart(2,'0');
function normDate(s,år){
  if(!s) return null; s=String(s).trim(); let m;
  if((m=s.match(/^(\d{4})-(\d{2})-(\d{2})/))) return `${m[1]}-${m[2]}-${m[3]}`;
  if((m=s.match(/^(\d{1,2})[.\/](\d{1,2})[.\/](\d{4})$/))) return `${m[3]}-${pad(+m[2])}-${pad(+m[1])}`;
  if((m=s.match(/^(\d{1,2})\.\s*([a-zæøå]{3})/i))){
    const mn=MND[m[2].toLowerCase().slice(0,3)];
    if(mn) return `${år||2026}-${pad(mn)}-${pad(+m[1])}`;
  }
  return null;
}
const MNDNAVN=['januar','februar','mars','april','mai','juni','juli','august','september','oktober','november','desember'];
function visDato(iso){
  const [y,m,d]=iso.split('-').map(Number);
  return {dag:d, mnd:MNDNAVN[m-1].slice(0,3), lang:`${d}. ${MNDNAVN[m-1]}`};
}
const normTitle=s=>(s||'').toLowerCase().replace(/[’'`]/g,'')
  .replace(/[^a-z0-9æøåäöé ]/g,' ').replace(/\s+/g,' ').trim();
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const renskMerknad=s=>!s?'':(/d[åa]p/i.test(s)?'Dåp':s);

/* ============================================================== DATA ===== */
const DATA={sanger:new Map(),sangvalg:new Map(),datoer:new Map(),gudstj:new Map(),datoliste:[]};

function byggSangbank(rows){
  for(const r of rows.slice(1)){
    if(!r[2]) continue;
    DATA.sanger.set(normTitle(r[2]),{tittel:r[2],tekstfil:r[8]||'',blekkefil:r[9]||''});
  }
}
function byggSangvalg(rows){
  if(!rows.length) return;
  const head=rows[0];
  for(let c=1;c<head.length;c++){
    const iso=normDate(head[c]); if(!iso) continue;
    const liste=[];
    for(let r=1;r<rows.length;r++)
      if(rows[r][c]) liste.push({slot:rows[r][0]||`Sang ${r}`,tittel:rows[r][c]});
    DATA.sangvalg.set(iso,liste);
  }
}
function byggDatoer(rows){
  for(const r of rows.slice(1)){
    const iso=normDate(r[4])||normDate(r[0]); if(!iso) continue;
    DATA.datoer.set(iso,{team:(r[1]||'').trim(),ikkeMed:(r[2]||'').trim(),vikar:(r[3]||'').trim()});
  }
}
/** Team-arket: Team | Vokal 1 | Vokal 2 | Piano | Gitar | Bass | Trommer | Annet */
function byggTeam(rows){
  if(rows.length<2) return;
  const head=rows[0], ny={};
  for(const r of rows.slice(1)){
    const nr=(r[0]||'').trim(); if(!nr) continue;
    const folk=[];
    for(let c=1;c<head.length;c++){
      if((head[c]||'').trim() && (r[c]||'').trim()) folk.push([r[c].trim(), head[c].trim()]);
    }
    if(folk.length) ny[nr]=folk;
  }
  if(Object.keys(ny).length) TEAMS=ny;
}
function byggGudstj(rows){
  for(const r of rows.slice(1)){
    const iso=normDate(r[1]); if(!iso) continue;
    DATA.gudstj.set(iso,{kl:r[2]||'',tema:r[5]||'',taler:r[6]||'',
      moteleder:r[8]||'',merknad:renskMerknad(r[14])});
  }
}

/* ====================================================== BESETNINGEN ===== */
const rosterFor = t => TEAMS[t] || TEAMS[(t||'').replace(/^Team\s*/i,'')] || [];
const listeAv   = s => (s||'').split(/[,;]/).map(x=>x.trim()).filter(Boolean);
const fornavn   = n => (n||'').trim().split(/\s+/)[0].toLowerCase();

function delRolle(navn, rolle){
  const vokal=[], instr=[];
  (rolle||'').split('/').map(s=>s.trim()).filter(Boolean).forEach(del=>{
    if(/vokal|sang/i.test(del)) vokal.push({navn, detalj:/leder/i.test(del)?'leder':''});
    else instr.push({navn, detalj:del.replace(/\(.*?\)/g,'').trim().toLowerCase()});
  });
  if(!vokal.length && !instr.length) instr.push({navn, detalj:''});
  return {vokal, instr};
}
/** Vikarfeltet: enten et behov («Trenger vikar (vokal)») eller navn («Rikard (gitar)»). */
function lesVikar(tekst){
  const behov=[], folk=[];
  listeAv(tekst).forEach(del=>{
    if(/^trenger/i.test(del)){ behov.push(del); return; }
    const m=del.match(/^(.+?)\s*\((.+?)\)\s*$/);
    if(m) folk.push({navn:m[1].trim(), rolle:m[2].trim()});
    else if(del) folk.push({navn:del, rolle:''});
  });
  return {behov, folk};
}
function sondagInfo(iso){
  const d=DATA.datoer.get(iso)||{};
  const roster=rosterFor(d.team);
  const ute=listeAv(d.ikkeMed).map(fornavn);
  const spiller=roster.filter(([n])=>!ute.includes(fornavn(n)));
  const vokal=[], instr=[];
  spiller.forEach(([n,r])=>{ const s=delRolle(n,r); vokal.push(...s.vokal); instr.push(...s.instr); });
  const v=lesVikar(d.vikar);
  v.folk.forEach(p=>{
    const s=delRolle(p.navn,p.rolle||'Annet');
    s.vokal.forEach(x=>vokal.push({...x,vikar:true}));
    s.instr.forEach(x=>instr.push({...x,vikar:true}));
  });
  /* Kristoffer gjør bare én ting om gangen: enten vokal eller piano.
     Mangler bandet piano/gitar, settes han på piano — og faller
     dermed ut av vokalrekka, slik at behovet der blir synlig. */
  const erHarmoni = p => /piano|gitar|keys|klaver/i.test(p.detalj);
  const erK = p => fornavn(p.navn)==='kristoffer';
  if(vokal.some(erK) || instr.some(erK)){
    const andreHarmoni = instr.some(p=>erHarmoni(p) && !erK(p));
    const kv = vokal.find(erK), ki = instr.find(erK);
    /* Er harmonien dekket av andre, synger han. Ellers spiller han piano. */
    if(andreHarmoni && kv){
      for(let j=instr.length-1;j>=0;j--) if(erK(instr[j])) instr.splice(j,1);
    }else{
      for(let j=vokal.length-1;j>=0;j--) if(erK(vokal[j])) vokal.splice(j,1);
      if(!ki) instr.push({navn:(kv||{}).navn||'Kristoffer', detalj:'piano', vikar:(kv||{}).vikar});
    }
  }
  /* Kravet til et komplett band:
     minst én som spiller piano eller gitar, og minst to vokalister.
     Behovet regnes ut her — det skrives ikke i regnearket. */
  const harHarmoni = instr.some(erHarmoni);
  const behov=[];
  if(!harHarmoni) behov.push('piano eller gitar');
  if(vokal.length<2) behov.push(vokal.length===0 ? '2 vokalister' : 'vokal');
  return {
    team:d.team||'—', behov, vokal, instr,
    borte:roster.filter(([n])=>ute.includes(fornavn(n))),
    andreUte:listeAv(d.ikkeMed).filter(n=>!roster.some(([r])=>fornavn(r)===fornavn(n)))
  };
}
/** Alle som står i et fast team. Disse merkes ikke «vikar» når de
 *  hjelper til hos et annet team — bare folk utenfra får den merkelappen. */
function faste(){
  const s=new Set();
  Object.values(TEAMS).forEach(r=>r.forEach(([n])=>s.add(fornavn(n))));
  return s;
}
function allePersoner(){
  const m=new Map();
  Object.values(TEAMS).forEach(r=>r.forEach(([n])=>m.set(fornavn(n),n)));
  DATA.datoer.forEach(d=>lesVikar(d.vikar).folk.forEach(p=>{
    if(!m.has(fornavn(p.navn))) m.set(fornavn(p.navn),p.navn);
  }));
  return [...m.values()].sort((a,b)=>a.localeCompare(b,'nb'));
}
const spillerPa = (iso,f) => {
  const i=sondagInfo(iso);
  return [...i.vokal,...i.instr].some(p=>fornavn(p.navn)===f);
};

/* ================================================== HVEM SPILLER NÅR ===== */
function tegnHvem(valgt){
  const box=document.getElementById('wholist'), sum=document.getElementById('mine');
  if(!DATA.datoliste.length){ box.innerHTML=`<div class="tilstand">Fant ingen datoer.</div>`; return; }
  const rader=[]; let mine=0;
  for(const iso of DATA.datoliste){
    const i=sondagInfo(iso);
    const spillerNå = valgt && spillerPa(iso,valgt);
    const uteNå = valgt && (i.borte.some(([n])=>fornavn(n)===valgt)
                          || i.andreUte.some(n=>fornavn(n)===valgt));
    if(valgt && !spillerNå && !uteNå) continue;
    if(spillerNå) mine++;
    const v=visDato(iso);
    const F=faste();
    const vis = liste => liste.map(p=>{
      const meg = valgt && fornavn(p.navn)===valgt;
      return `<span class="p">${esc(p.navn)}`
           + (p.detalj?` <span class="instr">${esc(p.detalj)}</span>`:'')
           + (p.vikar && !F.has(fornavn(p.navn)) ? '<span class="instr"> (vikar)</span>':'')
           + (meg?'<span class="meg">deg</span>':'')
           + `</span>`;
    }).join('');
    rader.push(`<div class="rad ${spillerNå?'min':''}">
      <div class="dato"><b>${v.dag}</b><span>${v.mnd}</span></div>
      <div class="innhold">
        <div class="lag">${esc(i.team)}</div>
        <div class="linje"><span class="nok">Vokal</span><span class="verdier">${vis(i.vokal)||'<span class="ute">ingen</span>'}</span></div>
        <div class="linje"><span class="nok">Instrument</span><span class="verdier">${vis(i.instr)||'<span class="ute">ingen</span>'}</span></div>
        ${i.behov.length?`<div class="linje ute"><span class="nok">Trenger</span><span class="verdier">${esc(i.behov.join(' · '))}</span></div>`:''}
      </div></div>`);
  }
  box.innerHTML=`<div class="kort">${rader.join('')||'<div class="tilstand">Ingen søndager.</div>'}</div>`;
  sum.innerHTML = valgt
    ? `<div class="oppsum">${esc(allePersoner().find(n=>fornavn(n)===valgt)||valgt)} spiller ${mine} ${mine===1?'søndag':'søndager'} i høst.</div>`
    : '';
}

/* ========================================================= SET-LISTE ===== */
function fil(navn,hvor,hva){
  if(!navn) return `<span class="mangler">${hva} mangler</span>`;
  return `<a href="${filUrl(hvor,navn)}" target="_blank" rel="noopener">${hva} ↗</a>`;
}
/** Filnavnene for én søndag, i rekkefølge og uten duplikater. */
function samleFiler(iso, hvor){
  const ut=[];
  (DATA.sangvalg.get(iso)||[]).forEach(v=>{
    const s=DATA.sanger.get(normTitle(v.tittel)); if(!s) return;
    const navn = hvor==='blekke' ? s.blekkefil : s.tekstfil;
    if(navn && !ut.includes(navn)) ut.push(navn);
  });
  return ut;
}
/* Nedlasting skjer i skjulte rammer, én fil om gangen. Dropbox svarer med
   selve fila (dl=1), så nettleseren laster den ned uten å forlate siden.
   Er du ikke logget inn i Dropbox, skjer det ingenting — da må du åpne
   lenkene under i stedet. */
window.lastNedAlle = function(knapp, iso, hvor){
  const filer = samleFiler(iso, hvor);
  if(!filer.length) return;
  const tekst = knapp.dataset.tekst || knapp.textContent;
  knapp.dataset.tekst = tekst;
  knapp.disabled = true;
  filer.forEach((navn,k)=>setTimeout(()=>{
    const ram = document.createElement('iframe');
    ram.style.display = 'none';
    ram.src = filUrl(hvor,navn).replace('dl=0','dl=1');
    document.body.appendChild(ram);
    setTimeout(()=>ram.remove(), 90000);
    knapp.textContent = `Laster ned … ${k+1} av ${filer.length}`;
    if(k===filer.length-1) setTimeout(()=>{
      knapp.textContent = tekst; knapp.disabled = false;
    }, 2000);
  }, k*800));
};
function tegnSanger(iso){
  const valg=DATA.sangvalg.get(iso);
  if(!valg||!valg.length) return `<p class="tilstand" style="padding:10px 0">Ingen sanger lagt inn ennå.</p>`;
  const knapper = [['tekst','tekster'],['blekke','blekker']].map(([hvor,ord])=>{
    const n = samleFiler(iso,hvor).length;
    return n ? `<button class="lastned" onclick="lastNedAlle(this,'${iso}','${hvor}')">Last ned alle ${ord} (${n})</button>` : '';
  }).join('');
  return (knapper ? `<div class="knapperad">${knapper}</div>` : '')
    + `<ol class="sanger">`+valg.map(v=>{
    const s=DATA.sanger.get(normTitle(v.tittel));
    const files=s ? fil(s.tekstfil,'tekst','Sangtekst')+fil(s.blekkefil,'blekke','Blekke')
                  : `<span class="mangler">Står ikke i sangbanken — sjekk skrivemåten</span>`;
    return `<li><div class="plass">${esc(v.slot)}</div>
      <div class="tittel">${esc(v.tittel)}</div>
      <div class="filer">${files}</div></li>`;
  }).join('')+`</ol>`;
}
function tegnDetalj(iso){
  const g=DATA.gudstj.get(iso)||{}, d=DATA.datoer.get(iso)||{};
  const i=sondagInfo(iso);
  const info=[];
  if(g.tema) info.push(['Tema',g.tema]);
  if(g.taler) info.push(['Taler',g.taler]);
  if(g.moteleder) info.push(['Møteleder',g.moteleder]);
  if(g.kl) info.push(['Klokken',g.kl]);
  if(g.merknad) info.push(['Merknad',g.merknad]);
  const F=faste();
  const linje = liste => liste.map(p=>
    `${esc(p.navn)}${p.detalj?` <span class="instr">${esc(p.detalj)}</span>`:''}`
    + (p.vikar && !F.has(fornavn(p.navn)) ? '<span class="instr"> (vikar)</span>':'')).join(' · ');
  const v=[];
  if(i.behov.length) v.push(`<dt>Trenger</dt><dd><span class="merk">${esc(i.behov.join(' · '))}</span></dd>`);
  return `<div class="utfoldet">
    ${info.length?`<h3 class="etikett">Gudstjenesten</h3><dl>${info.map(([k,x])=>`<dt>${k}</dt><dd>${esc(x)}</dd>`).join('')}</dl>`:''}
    <h3 class="etikett">Besetning</h3>
    <dl><dt>Vokal</dt><dd>${linje(i.vokal)||'—'}</dd>
        <dt>Instrument</dt><dd>${linje(i.instr)||'—'}</dd>${v.join('')}</dl>
    <h3 class="etikett">Sanger</h3>${tegnSanger(iso)}</div>`;
}
function tegnSetliste(){
  const fDato=document.getElementById('f-dato').value;
  const fTeam=document.getElementById('f-team').value;
  const fMed =document.getElementById('f-medlem').value;
  const el=document.getElementById('setlist');
  const treff=DATA.datoliste.filter(iso=>{
    if(fDato && iso!==fDato) return false;
    if(fTeam && (DATA.datoer.get(iso)||{}).team!==fTeam) return false;
    if(fMed && !spillerPa(iso,fMed)) return false;
    return true;
  });
  document.getElementById('treff').textContent =
    treff.length===DATA.datoliste.length
      ? `${treff.length} søndager`
      : `${treff.length} av ${DATA.datoliste.length} søndager`;
  if(!treff.length){ el.innerHTML=`<div class="kort"><div class="tilstand">Ingen søndager passer filtrene.</div></div>`; return; }
  el.innerHTML=treff.map(iso=>{
    const v=visDato(iso), d=DATA.datoer.get(iso)||{}, g=DATA.gudstj.get(iso)||{};
    const n=(DATA.sangvalg.get(iso)||[]).length;
    const under=[g.tema,n?`${n} sanger`:'ingen sanger'].filter(Boolean).join(' · ');
    return `<div class="kort" data-iso="${iso}" style="margin-top:-1px"><div class="sund">
      <div class="dato"><b>${v.dag}</b><span>${v.mnd}</span></div>
      <div class="midt">
        <div class="a">${esc(d.team||'—')}</div>
        <div class="b">${esc(under)}</div>
      </div>
      <div class="teller ${n?'':'tom'}">${n}</div>
    </div></div>`;
  }).join('');
  el.querySelectorAll('.kort').forEach(k=>{
    k.querySelector('.sund').addEventListener('click',()=>{
      const åpen=k.querySelector('.utfoldet');
      if(åpen){ åpen.remove(); return; }
      el.querySelectorAll('.utfoldet').forEach(x=>x.remove());
      k.insertAdjacentHTML('beforeend',tegnDetalj(k.dataset.iso));
    });
  });
  // åpne automatisk når filteret peker på én enkelt søndag
  if(treff.length===1){
    const k=el.querySelector('.kort');
    k.insertAdjacentHTML('beforeend',tegnDetalj(treff[0]));
  }
}

/* ============================================================ FILTRE ===== */
function fyllFiltre(){
  const pers=allePersoner();
  const sel=document.getElementById('person');
  pers.forEach(n=>{ const o=document.createElement('option');
    o.value=fornavn(n); o.textContent=n; sel.appendChild(o); });
  sel.addEventListener('change',e=>tegnHvem(e.target.value));

  const fd=document.getElementById('f-dato');
  DATA.datoliste.forEach(iso=>{ const o=document.createElement('option');
    o.value=iso; o.textContent=visDato(iso).lang; fd.appendChild(o); });

  const ft=document.getElementById('f-team');
  [...new Set(DATA.datoliste.map(i=>(DATA.datoer.get(i)||{}).team).filter(Boolean))]
    .sort().forEach(t=>{ const o=document.createElement('option');
      o.value=t; o.textContent=t; ft.appendChild(o); });

  const fm=document.getElementById('f-medlem');
  pers.forEach(n=>{ const o=document.createElement('option');
    o.value=fornavn(n); o.textContent=n; fm.appendChild(o); });

  ['f-dato','f-team','f-medlem'].forEach(id=>
    document.getElementById(id).addEventListener('change',tegnSetliste));
  document.getElementById('nullstill').addEventListener('click',()=>{
    ['f-dato','f-team','f-medlem'].forEach(id=>document.getElementById(id).value='');
    tegnSetliste();
  });
}

/* ============================================================= START ===== */
async function hent(url){
  const r=await fetch(url);
  if(!r.ok) throw new Error('HTTP '+r.status);
  return parseCsv(await r.text());
}
async function start(){
  const jobber=[
    ['sangbanken',   csvUrl(PUB.sangbank,GID.kategorisert), byggSangbank],
    ['sangvalget',   csvUrl(PUB.sangbank,GID.sangvalg),     byggSangvalg],
    ['turnusen',     csvUrl(PUB.team,GID.datoer),           byggDatoer],
    ['teamene',      csvUrl(PUB.team,GID.team),             byggTeam],
    ['gudstjenester',csvUrl(PUB.gudstj,GID.gudstj),         byggGudstj]
  ];
  const feil=[];
  for(const [navn,url,fn] of jobber){
    try{ fn(await hent(url)); }catch(e){ feil.push(navn); }
  }
  if(feil.length){
    document.getElementById('banner').innerHTML =
      `<div class="varsel"><b>Fikk ikke hentet ${feil.join(', ')}.</b>
       Sjekk at regnearkene fortsatt er publisert på nettet. Åpner du denne fila direkte
       fra maskinen i stedet for fra en nettadresse, blokkerer nettleseren henting av data.</div>`;
  }
  DATA.datoliste=[...new Set([...DATA.datoer.keys(),...DATA.sangvalg.keys()])].sort();
  fyllFiltre();
  tegnHvem('');
  tegnSetliste();
}

const FANER=[['tab-who','view-who'],['tab-set','view-set']];
FANER.forEach(([knapp,visning])=>{
  document.getElementById(knapp).onclick=()=>{
    FANER.forEach(([k,v])=>{
      document.getElementById(k).classList.toggle('on',k===knapp);
      document.getElementById(v).classList.toggle('skjult',v!==visning);
    });
  };
});
start();
